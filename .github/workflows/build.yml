name: Build Ace Kernel Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Generate debug keystore
        run: |
          # Generate debug.keystore at android/app/ (matching build.gradle path)
          keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Verify project structure
        run: |
          echo "=== Android project structure ==="
          ls -la android/
          echo ""
          echo "=== Native modules ==="
          ls -la android/app/src/main/java/com/kerneluser/ace/
          echo ""
          echo "=== Build files ==="
          cat android/build.gradle
          echo ""
          cat android/settings.gradle
          echo ""
          cat android/app/build.gradle

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: List outputs
        run: |
          echo "=== Build outputs ==="
          find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
