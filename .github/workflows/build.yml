name: Build Ace Kernel Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Verify assets
        run: |
          echo "=== Checking assets ==="
          ls -la assets/ 2>/dev/null || echo "assets/ missing!"
          for f in icon.png splash.png adaptive-icon.png; do
            if [ -f "assets/$f" ]; then
              file "assets/$f"
            else
              echo "MISSING: assets/$f"
            fi
          done

      - name: Prebuild Expo project
        run: npx expo prebuild --platform android --no-install

      - name: Copy native Kotlin modules
        run: |
          echo "=== Copying native modules ==="
          TARGET_DIR="android/app/src/main/java/com/kerneluser/ace"
          mkdir -p "$TARGET_DIR"
          cp native/*.kt "$TARGET_DIR/"
          ls -la "$TARGET_DIR/"

      - name: Register native modules in MainApplication
        run: |
          echo "=== Patching MainApplication.kt ==="
          MAIN_APP=$(find android -name "MainApplication.kt" | head -1)
          echo "Found: $MAIN_APP"

          # 添加 import
          if ! grep -q "AceKernelManagerPackage" "$MAIN_APP"; then
            sed -i '/^import /a import com.kerneluser.ace.AceKernelManagerPackage' "$MAIN_APP"
          fi

          # 添加 packages.add
          if ! grep -q "AceKernelManagerPackage()" "$MAIN_APP"; then
            sed -i '/packages.add(new.*ReactPackage()/a\            packages.add(new AceKernelManagerPackage())' "$MAIN_APP"
          fi

          echo "=== Patched MainApplication.kt ==="
          cat "$MAIN_APP"

      - name: Add permissions to AndroidManifest
        run: |
          echo "=== Patching AndroidManifest.xml ==="
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # 添加 uses-permission 到 <manifest> 标签内（在 <application> 之前）
          if ! grep -q 'READ_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' "$MANIFEST"
          fi
          if ! grep -q 'WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST"
          fi

          echo "=== Patched AndroidManifest.xml ==="
          cat "$MANIFEST"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: List outputs
        run: |
          echo "=== Build outputs ==="
          find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
